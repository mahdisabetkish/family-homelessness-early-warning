name: pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `enablement` turns Pages on and points it at Actions the first time this
      # runs, so a fresh clone of the repository does not need the setting
      # flipped by hand in Settings -> Pages before the first deploy succeeds.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # `enablement` does not change an existing site. If Pages was switched to
      # "Deploy from a branch", the site serves the repository root instead of
      # docs/ and the dashboard's data files 404. Put the source back on Actions.
      - name: Publish from Actions, not from a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
